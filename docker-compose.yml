services:
  mailarchive:
    build: .
    image: mailarchive:latest
    container_name: mailarchive
    ports:
      - "8000:8000"
    environment:
      # SQLite 数据库文件（容器内路径）；随服务启动自动建表
      DATABASE_PATH: /data/mailarchive.db
    volumes:
      - mailarchive-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mailarchive-data:
